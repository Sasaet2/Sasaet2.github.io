<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="لعبة حجر ورقة مقص ضد الكمبيوتر - من مشاريع صموئيل صبحي.">
  <title>حجر ورقة مقص — صموئيل صبحي</title>
  <!-- Hand icons: Twemoji, CC-BY 4.0 (https://twemoji.twitter.com) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #050811;
      color: #f8fafc;
      font-family: "Cairo", sans-serif;
      padding: 24px;
    }
    h1 {
      background: linear-gradient(90deg, #00f3ff, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.4rem;
      font-weight: 900;
    }
    .scoreboard {
      display: flex;
      gap: 40px;
      padding: 14px 34px;
      border: 1px solid rgba(0, 243, 255, .25);
      border-radius: 16px;
      background: rgba(15, 23, 42, .7);
      font-size: 1.15rem;
      font-weight: 700;
    }
    .scoreboard span { color: #00f3ff; }
    .choices { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
    .choice {
      width: 110px;
      height: 110px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 20px;
      background: rgba(255, 255, 255, .05);
      font-size: 3rem;
      cursor: pointer;
      transition: .2s;
    }
    .choice:hover { transform: translateY(-6px) scale(1.05); border-color: #00f3ff; }
    .result {
      min-height: 80px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #94a3b8;
    }
    .result .win  { color: #10b981; }
    .result .lose { color: #ef4444; }
    .result .draw { color: #f59e0b; }
    .reset {
      padding: 10px 28px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 12px;
      background: transparent;
      color: #94a3b8;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: .2s;
    }
    .reset:hover { color: #fff; border-color: #8b5cf6; }
    .back {
      position: absolute;
      top: 18px;
      inset-inline-start: 20px;
      color: #94a3b8;
      text-decoration: none;
      font-size: .95rem;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 10px;
      transition: .2s;
    }
    .back:hover { color: #00f3ff; border-color: #00f3ff; }
    .choice .hand-icon { width: 54px; height: 54px; display: block; margin: 0 auto; }
    .result .hand-icon { width: 1.3em; height: 1.3em; vertical-align: -0.28em; }
  </style>
</head>
<body>
  <a class="back" href="index.html">→ رجوع للموقع</a>

  <button class="reset" id="reset">تصفير النتيجة</button>

  <script>
    const moves = {
      rock:     { emoji: `<svg class="hand-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#EF9645" d="M32.218 10.913c-.81-1.187-2.172-1.967-3.718-1.967H28s-5.353-5.672-5.15-6.091C21.754 3.446 21 4.591 21 5.924c0 0-5.509-3.431-5.247-3.947C14.71 2.669 14 3.946 14 5.424v.522S8.553 4.321 8.857 3.851C7.757 4.441 7 5.588 7 6.924V8.81l-6 6.272v2.645l17.16 14.439c0 .001 13.128-22.164 14.058-21.253z"/><g fill="#FFDC5D"><path d="M4.124 18.946c1.474 0 2.738-.831 3.392-2.043.678 1.212 1.958 2.043 3.446 2.043h.076c1.153 0 2.169-.51 2.889-1.298.023-.024.073-.082.073-.082.185-.212.343-.448.481-.695.04-.072.281-.621.342-.833.052-.173.106-.344.134-.526.141.167.296.319.46.46.069.059.45.339.576.413.589.351 1.271.56 2.008.56h3.166c-.535.27-.999.614-1.424 1-1.729 1.568-2.579 4.085-2.579 7.663 0 .276.224.5.5.5s.5-.224.5-.5c0-3.962 1.01-6.427 3.24-7.663 1.175-.651 2.682-.967 4.571-.967.059 0 .526-.033.526-.033.276 0 .5-.224.5-.5s-.224-.5-.5-.5H18c-1.657 0-3-1.343-3-3s1.343-3 3-3h11c.973 0 2.288.056 3.218.967.325.318.604.736.803 1.297l1.659 5.472c.156.512.73 2.857.626 3.346 0 7.34-8.7 14.972-19.004 14.972C6.326 36 1 27.883 1 17.957v-.229c.01.01.021.016.031.026.881.882 1.799 1.192 2.845 1.192h.248z"/><path d="M3.864 5.946h.271C5.718 5.946 7 7.229 7 8.81v6.272c0 1.582-1.282 2.864-2.864 2.864h-.272C2.282 17.946 1 16.664 1 15.082V8.81c0-1.581 1.282-2.864 2.864-2.864zm10.136 9c0 .891-.396 1.683-1.014 2.233-.53.472-1.221.767-1.986.767-1.657 0-3-1.343-3-3v-9c0-.816.328-1.554.857-2.095.544-.557 1.302-.905 2.143-.905 1.657 0 3 1.343 3 3v9zm4-6c-1.201 0-2.267.541-3 1.38v-6.38c0-.758.29-1.442.753-1.97.55-.627 1.347-1.03 2.247-1.03 1.657 0 3 1.343 3 3v5h-3zm4-4.007c0-.812.326-1.545.85-2.085.544-.559 1.301-.909 2.143-.909h.014C26.66 1.946 28 3.286 28 4.939v4.007h-6V4.939z"/></g></svg>`, name: "حجر",  beats: "scissors" },
      paper:    { emoji: `<svg class="hand-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#EF9645" d="M20.5 2.965c-1.381 0-2.5 1.119-2.5 2.5v.005L15.5.465c-1.381 0-2.5 1.119-2.5 2.5V4.25l-2.5-1.535c-1.381 0-2.5 1.119-2.5 2.5V8.75L7 18h13.542L20.5 2.965z"/><path fill="#FFDC5D" d="M31.375 16.219c-1.381-.611-3.354.208-4.75 2.188-.917 1.3-1.187 3.151-2.391 3.344-.46.073-1.234-.313-1.234-1.397V4.5s0-2-2-2-2 2-2 2v11.633c0-.029-1-.064-1-.082V2s0-2-2-2-2 2-2 2v14.053c0 .017-1 .041-1 .069V4.25s0-2-2-2-2 2-2 2v12.638c0 .118-1 .251-1 .398V8.75s0-2-2-2-2 2-2 2V24c0 6.627 5.373 12 12 12 4.775 0 8.06-2.598 9.896-5.292 1.557-2.285 2.009-4.658 2.104-5.375 0 0 .123-1.479 1.156-2.865 1.469-1.969 2.5-3.156 3.125-3.866.317-.358.625-1.706-.906-2.383z"/><path fill="#EF9645" d="M23.439 21.471c-.297-.266-.372-.552-.417-.808-1.892.259-4.457.789-6.427 2.715-2.556 2.499-2.992 5.2-2.971 7.007.017 1.457.812 2.147 1.045-.012.292-2.706 2.254-8.063 8.784-8.58.028-.002.387-.024.591-.035 0 0-.352-.06-.605-.287z"/></svg>`, name: "ورقة", beats: "rock" },
      scissors: { emoji: `<svg class="hand-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#EF9645" d="M26.992 19.016c-.255-.255-.553-.47-.875-.636l-.4-1.356-8.012-.056-.307 1.091c-.467.095-1.041.389-1.393.718l-3.611-3.954c-.817.364-1.389 1.18-1.389 2.133v.96l-4 4.166.016 2.188 9.984 10.729s10.518-15.288 10.543-15.258c-.127-.224-.511-.703-.556-.725z"/><g fill="#FFDC5D"><path d="M24.581 18H18c-.208 0-.411.021-.607.061l-.073-.278-3.273-12.464s-.416-1.957 1.54-2.372c1.956-.416 2.372 1.54 2.372 1.54l3.097 11.569c.446.024.878.063 1.305.107l2.061-10.512s.188-1.991 2.18-1.804c1.991.188 1.803 2.179 1.803 2.179L26.34 17.187l-.221 1.194c-.464-.235-.982-.381-1.538-.381zM8.916 16h.168c1.059 0 1.916.858 1.916 1.917v4.166C11 23.142 10.143 24 9.084 24h-.168C7.857 24 7 23.142 7 22.083v-4.166C7 16.858 7.857 16 8.916 16zm6.918 2.96l-.056.062C15.304 19.551 15 20.233 15 21c0 .063.013.123.018.185.044.678.308 1.292.728 1.774-.071.129-.163.243-.259.353-.366.417-.89.688-1.487.688-1.104 0-2-.896-2-2v-6c0-.441.147-.845.389-1.176.364-.497.947-.824 1.611-.824 1.104 0 2 .896 2 2v2.778c-.061.055-.109.123-.166.182z"/><path d="M9.062 25c1.024 0 1.925-.526 2.45-1.322.123.183.271.346.431.497 1.185 1.115 3.034 1.044 4.167-.086.152-.152.303-.305.419-.488l-.003-.003C16.727 23.713 17 24 18 24h2.537c-.37.279-.708.623-1.024 1-1.228 1.467-2.013 3.606-2.013 6 0 .276.224.5.5.5s.5-.224.5-.5c0-2.548.956-4.775 2.377-6 .732-.631 1.584-1 2.498-1 .713.079.847-1 .125-1H18c-1.104 0-2-.896-2-2s.896-2 2-2h8c.858 0 1.66.596 1.913 1.415L29 24c.103.335.479 1.871.411 2.191C29.411 31 24.715 36 19 36c-6.537 0-11.844-5.231-11.986-11.734l.014.01c.515.445 1.176.724 1.91.724h.124z"/></g></svg>`, name: "مقص",  beats: "paper" },
    };

    let playerScore = 0;
    let computerScore = 0;

    const resultEl = document.getElementById("result");
    const playerScoreEl = document.getElementById("player-score");
    const computerScoreEl = document.getElementById("computer-score");

    function computerMove() {
      const keys = Object.keys(moves);
      return keys[Math.floor(Math.random() * keys.length)];
    }

    function play(playerMove) {
      const computer = computerMove();
      const you = moves[playerMove];
      const cpu = moves[computer];
      const picked = `أنت ${you.emoji} ${you.name} — الكمبيوتر ${cpu.emoji} ${cpu.name}`;

      if (playerMove === computer) {
        resultEl.innerHTML = `${picked}<br><span class="draw">تعادل!</span>`;
      } else if (you.beats === computer) {
        playerScore++;
        resultEl.innerHTML = `${picked}<br><span class="win">كسبت الجولة!</span>`;
      } else {
        computerScore++;
        resultEl.innerHTML = `${picked}<br><span class="lose">خسرت الجولة!</span>`;
      }
      playerScoreEl.textContent = playerScore;
      computerScoreEl.textContent = computerScore;
    }

    document.querySelectorAll(".choice").forEach(button => {
      button.addEventListener("click", () => play(button.dataset.move));
    });

    document.getElementById("reset").addEventListener("click", () => {
      playerScore = 0;
      computerScore = 0;
      playerScoreEl.textContent = "0";
      computerScoreEl.textContent = "0";
      resultEl.textContent = "اختر حركتك!";
    });
  </script>
</body>
</html>
